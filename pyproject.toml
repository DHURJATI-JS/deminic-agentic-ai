[project]
name = "deminic-agentic-ai"
version = "1.0.0"
description = "Deminic - a locally hosted, multi-user agentic personal AI (personal, business and coding modes)."
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1.4",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "pgvector>=0.3.6",
    "redis>=5.2",
    "python-socketio>=5.11",
    "slowapi>=0.1.9",
    "argon2-cffi>=23.1",
    "itsdangerous>=2.2",
    "cryptography>=43",
    "httpx>=0.27",
    "python-multipart>=0.0.18",
    "aiosmtplib>=3.0",
    "beautifulsoup4>=4.12",
    "defusedxml>=0.7.1",
    "pillow>=11.0",
    "pydantic-settings>=2.6",
    "email-validator>=2.2",
    "packaging>=24.0",
    "locust>=2.32",
    "tzdata>=2026.6",
    "pypdf>=7.1.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "playwright>=1.49",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
